# GitLab positive-control arm catalog.
#
# The first twelve arms are the existing generic catalog copied unchanged from
# configs/arms_initial.yaml. The final four arms add GitLab-specific operating
# guidance without encoding benchmark task answers.

arms:
  - arm_id: baseline
    name: Baseline
    vector: {planning: 0, verification: 0, agency: 0, expertise: 1, format: 0, goal: 0}
  - arm_id: planner
    name: Planner
    vector: {planning: 3, verification: 1, agency: 1, expertise: 2, format: 2, goal: 1}
  - arm_id: cautious
    name: Cautious
    vector: {planning: 2, verification: 3, agency: 0, expertise: 2, format: 2, goal: 2}
  - arm_id: explorer
    name: Explorer
    vector: {planning: 1, verification: 0, agency: 2, expertise: 2, format: 0, goal: 0}
  - arm_id: balanced
    name: Balanced
    vector: {planning: 2, verification: 2, agency: 1, expertise: 2, format: 1, goal: 1}
  - arm_id: overthinker
    name: Overthinker
    vector: {planning: 3, verification: 3, agency: 1, expertise: 3, format: 3, goal: 2}
  - arm_id: rapid
    name: Rapid
    vector: {planning: 0, verification: 0, agency: 2, expertise: 2, format: 0, goal: 0}
  - arm_id: verifier
    name: Verifier
    vector: {planning: 1, verification: 3, agency: 0, expertise: 2, format: 2, goal: 1}
  - arm_id: exploratory
    name: Exploratory
    vector: {planning: 2, verification: 1, agency: 2, expertise: 1, format: 1, goal: 0}
  - arm_id: algorithmic
    name: Algorithmic
    vector: {planning: 3, verification: 2, agency: 1, expertise: 3, format: 3, goal: 2}
  - arm_id: junior_reactive
    name: Junior Reactive
    vector: {planning: 1, verification: 2, agency: 0, expertise: 0, format: 1, goal: 1}
  - arm_id: domain_expert
    name: Domain Expert
    vector: {planning: 2, verification: 1, agency: 2, expertise: 3, format: 2, goal: 2}

  - arm_id: gitlab_domain_expert
    name: GitLab Domain Expert
    vector: {planning: 3, verification: 2, agency: 2, expertise: 3, format: 3, goal: 2}
    prompt_guidance: |
      Use a highly structured software engineering workflow optimized for GitLab.
      Read the task completely before acting. Identify the GitLab object involved:
      repository, issue, merge request, branch, member, milestone, label, settings,
      or permissions. Determine the desired final state before interacting.
      Inspect current state before modifying anything. Search before creating.
      Make minimal reversible edits. Never delete unless explicitly requested.
      Navigate intentionally through GitLab. Re-open pages after changes to verify
      success. Gather evidence before acting when uncertain. Avoid repeating failed
      actions. Prioritize correctness over speed.

  - arm_id: gitlab_rapid_executor
    name: GitLab Rapid Executor
    vector: {planning: 0, verification: 0, agency: 2, expertise: 2, format: 1, goal: 0}
    prompt_guidance: |
      Execute GitLab tasks quickly with minimal planning. Begin acting quickly,
      minimize upfront reasoning, and use as few browser actions as possible.
      Minimize verification and verify only when confidence is low. Prefer speed
      over exhaustive checking, while recovering quickly after failures.

  - arm_id: gitlab_auditor
    name: GitLab Auditor
    vector: {planning: 2, verification: 3, agency: 1, expertise: 3, format: 2, goal: 2}
    prompt_guidance: |
      Use maximum verification for GitLab tasks. Inspect repository state before
      every change. Verify assumptions before acting. Re-check pages after
      modifications. Confirm permissions before editing. Validate final state
      carefully. Prefer gathering more evidence over making uncertain changes.
      Sacrifice speed for correctness.

  - arm_id: gitlab_planner
    name: GitLab Planner
    vector: {planning: 3, verification: 2, agency: 1, expertise: 2, format: 2, goal: 1}
    prompt_guidance: |
      Decompose GitLab tasks explicitly. Build a concise internal plan, break
      the task into sequential subtasks, complete one subtask before the next,
      and re-evaluate progress after every completed step. Use systematic project
      navigation. Perform one verification pass at the end. Balance planning and
      efficiency.

  - arm_id: gitlab_super_operator
    name: GitLab Super Operator
    vector: {planning: 0, verification: 0, agency: 2, expertise: 3, format: 1, goal: 0}
    prompt_guidance: |
      Operate like a fast GitLab maintainer. Finish as soon as the requested
      state is set; do not loop looking for extra confirmation.
      Act immediately, but first classify the task by object and field: issue,
      epic, milestone, iteration/cadence, label, board, todo, assignee, date,
      weight, time estimate, health status, confidentiality, or delete/close.

      Use GitLab search and filtered lists aggressively. Search exact titles,
      assignee names, labels, milestones, or iteration names before creating or
      editing. Prefer the existing issue/epic detail page over broad navigation.
      When a task says "all", filter the issue list to the requested assignee,
      milestone, iteration, state, or label and update every matching open item.

      Issue workflow: open the target issue, use the right sidebar or Edit page
      for assignees, labels, milestone, iteration, due date, start date, weight,
      time estimate, health status, and confidential flag. Save/apply each field
      change. For sidebar popovers such as weight, time estimate, dates, health,
      and confidentiality, if the editor or edit form shows the requested value
      after save, treat the task as complete even if the collapsed sidebar does
      not display the value clearly. Do not reopen the same editor more than once
      for verification.

      Epic workflow: open the target epic from the group/project epics list,
      use the epic detail page for status and labels, and use the child issue
      or add-existing-issue control when the task asks to add an issue to an
      epic. For replacing labels, remove the old label and add the new label in
      the same edit flow when possible.

      Milestone and iteration workflow: use Plan/Milestones for milestones and
      Plan/Iterations or the cadence settings for iterations. When creating,
      preserve exact names and dates from the instruction. For cadence settings,
      explicitly find toggles for automatic scheduling and roll-over and turn
      both off when requested.

      Label, board, and todo workflow: use project labels/settings for renames
      and descriptions; use boards to create boards and label lists; use the
      todo list for done, restore, or snoozed todo actions.

      Delete only when the instruction explicitly says delete. For closing or
      reopening, use the object's state control rather than editing labels.
      After the final change, perform at most one quick check by re-reading the
      current page, editor, or filtered list. If the desired value is already in
      the control you saved, finish immediately.

  - arm_id: gitlab_oracle_operator
    name: GitLab Oracle Operator
    vector: {planning: 0, verification: 0, agency: 2, expertise: 3, format: 0, goal: 0}
    prompt_guidance: |
      This is a synthetic positive-control arm. Use benchmark-specific routing:
      match the visible task instruction to the cookbook below and execute the
      listed route. Prefer direct hash URLs over navigation. If the task gives
      http://localhost:8001, you may navigate directly to paths such as
      http://localhost:8001/#/edit-issue/issue_30. Save once, then finish.
      Do not repeatedly verify hidden sidebar fields; the saved form value is
      enough.

      Default component: use the Rapid arm behavior: act immediately, no
      written plan, one direct edit path, finish as soon as the requested state
      is set. For ordinary close/reopen/delete/rename/label tasks, use the
      existing visible button or the edit page and stop.

      Exact issue/epic/milestone/iteration ids:
      issue_5 component library documentation; issue_7 GraphQL gateway;
      issue_9 rate limiting to v3 endpoints; issue_10 APM slow queries;
      issue_13 CSP headers; issue_14 vulnerable
      dependencies; issue_17 Safari blank screen; issue_22 dark mode;
      issue_23 keyboard shortcuts; issue_25 real-time collaborative editing;
      issue_27 keyset pagination; issue_28 bundle size; issue_29 lazy loading;
      issue_30 project README; issue_33 Playwright testing; issue_43 loading
      skeletons; issue_44 retry mechanism; issue_45 webhook support; issue_48
      dropdown menu position; issue_53 404 typo; issue_54 sidebar tooltip;
      issue_64 container registry garbage collection; issue_67 JWT migration.
      epic_1 Platform Redesign; epic_2 Frontend Modernization; epic_11
      Analytics Dashboard. ms_1 v4.0 Platform Redesign; ms_2 v4.1 Performance;
      ms_6 Backlog; ms_7 Q1 2026 Planning. iter_4 Sprint 26; iter_5 Sprint 27;
      cad_1 Sprint Cadence. labels: lbl_1 priority::critical, lbl_19
      needs-discussion, lbl_22 performance, lbl_23 UX, lbl_24 breaking-change,
      lbl_26 technical-debt.

