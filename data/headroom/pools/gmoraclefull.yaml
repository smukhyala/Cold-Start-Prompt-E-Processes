  prompt_guidance: "This is a synthetic positive-control arm. Below is an answer key: one line per task, giving the\ntask's exact instruction in quotes, then the exact items (emails by numeric id with their subject and sender,\nlabels by id and name, filters by id) and the exact final values to produce.\n\nProcedure, every time:\n1. Before any other action, find the ONE answer-key line whose quoted instruction is identical to your task.\n   In your first reasoning step, copy that line's target state.\n2. Use exactly the emails, labels and filters it lists, and all of them. Do not search for or guess which items\n   are meant: the key already names them.\n3. Open each email directly by URL on the same host and port as the start page, e.g. <start host>/#/email/15\n   (the number is the email id). Other pages: #/inbox, #/starred, #/snoozed, #/sent, #/drafts, #/important,\n   #/allmail, #/spam, #/trash, #/label/label_17 (the mail with that label), and the settings pages\n   #/settings/general, #/settings/labels, #/settings/inbox and #/settings/filters (filters and blocked\n   addresses). Opening an email marks it as read.\n4. Make every listed change and save (send any email you are told to compose).\n5. Before you finish, reopen each listed item and check every listed value against the key. If any value differs,\n   fix it and save again. Finish only when every listed value matches.\n\nAnswer key lines are matched on the quoted instruction, word for word. In a quoted text value, \\n is a line break; \"none\" and \"empty\" mean the field is blank.\n\nAnswer key (per-task cookbook):\n- \"Star Sarah Chen's Q1 product roadmap email.\" → email 1 \"Q1 Product Roadmap Review\" from Sarah Chen <sarah.chen@techcorp.io>: starred false → true; star type none → \"yellow-star\".\n- \"Mark Priya Sharma's latest message about the API integration issue as read.\" → email 2 \"Re: API Integration Issue\" from Priya Sharma <priya.sharma@cloudnine.dev>: read false → true.\n- \"Trash the volunteer event email from Ana Gutierrez.\" → email 12 \"Volunteer Event: Spring Health Fair\" from Ana Gutierrez <ana.g@globalhealth.org>: labels: remove INBOX \"Inbox\"; in trash false → true.\n- \"Turn off hover actions.\" → setting hoverActions (Settings > general tab): true → false.\n- \"The Crypto Gains email in spam isn't actually spam — move it back to the inbox.\" → email 93 \"Turn $100 into $100,000 with this coin!\" from Crypto Gains <invest@cryptomoon.xyz>: labels: add INBOX \"Inbox\"; in spam true → false.\n- \"Set the default reply behavior to Reply all.\" → setting defaultReplyBehavior (Settings > general tab): \"reply\" → \"reply_all\".\n- \"Mark Marcus Williams' Design System Update email as important.\" → email 6 \"Design System Update v4.2\" from Marcus Williams <marcus.w@designhub.com>: important false → true; labels: add IMPORTANT \"Important\".\n- \"Unstar the contract review email from James O'Brien.\" → email 11 \"Contract Review: Vendor Agreement\" from James O'Brien <james.obrien@lawfirm.legal>: starred true → false; star type \"red-star\" → none.\n- \"Switch to compact display density.\" → setting density (Settings > general tab): \"default\" → \"compact\".\n- \"Turn off keyboard shortcuts.\" → setting keyboardShortcutsEnabled (Settings > general tab): true → false.\n- \"Unblock the sender annoying@daily-deals.biz.\" → UNBLOCK sender annoying@daily-deals.biz.\n- \"Mark the conference speaker invitation from Sophie Laurent as read.\" → email 14 \"Bonjour! Conference Speaker Invitation\" from Sophie Laurent <sophie.l@eurodesign.fr>: read false → true.\n- \"Set the maximum page size to 25 conversations.\" → setting maxPageSize (Settings > general tab): 50 → 25.\n- \"Trash the property listing email from Tom Bradley.\" → email 15 \"Property Listing: 45 Oak Avenue\" from Tom Bradley <tom.bradley@realtyhome.com>: labels: remove INBOX \"Inbox\"; in trash false → true.\n- \"Archive the shipping update from Carlos Mendez.\" → email 19 \"Shipping Update: Order #LP-2026-8834\" from Carlos Mendez <carlos.m@logisticspro.net>: labels: remove INBOX \"Inbox\"; archived false → true.\n- \"Turn off conversation view.\" → setting conversationView (Settings > general tab): true → false.\n- \"Switch to dark mode.\" → setting theme (Settings > general tab): \"default\" → \"dark\".\n- \"The collaboration proposal from Jennifer Wu isn't important — remove the importance marker.\" → email 20 \"Re: Collaboration Proposal\" from Jennifer Wu <jennifer.wu@biomedresearch.com>: important true → false.\n- \"Remove the star from Emily Rodriguez's partnership opportunity email.\" → email 7 \"Partnership Opportunity - Series B Company\" from Emily Rodriguez <emily.r@startupventures.co>: starred true → false; star type \"yellow-star\" → none.\n- \"Change the undo send timer to 30 seconds.\" → setting undoSendDelay (Settings > general tab): 5 → 30.\n- \"Create a label called 'Q1 Priority' nested under Work, then apply it to Sarah Chen's Q1 Product Roadmap Review email.\" → CREATE label \"Q1 Priority\", nested under label_1 \"Work\", color background #2962ff, text #fff. email 1 \"Q1 Product Roadmap Review\" from Sarah Chen <sarah.chen@techcorp.io>: labels: add \"Q1 Priority\" (the new label).\n- \"Remove all user labels from Priya Sharma's Sprint Retro Action Items email and add Waiting For Reply instead.\" → email 29 \"Sprint Retro Action Items\" from Priya Sharma <priya.sharma@cloudnine.dev>: labels: add label_18 \"Waiting For Reply\"; remove label_1 \"Work\", label_9 \"Projects\".\n- \"Trash all unread primary emails that have attachments.\" → email 1 \"Q1 Product Roadmap Review\" from Sarah Chen <sarah.chen@techcorp.io>; email 6 \"Design System Update v4.2\" from Marcus Williams <marcus.w@designhub.com>; email 9 \"CI/CD Pipeline Migration Plan\" from Nate Patel <nate.patel@devops.tools>; email 26 \"Brand Refresh Concepts\" from Lisa Nakamura <lisa.n@creativeagency.co>: labels: remove INBOX \"Inbox\"; in trash false → true.\n- \"Mark Marcus Williams' Design System Update as read, star it with a blue star, and apply the Projects label.\" → email 6 \"Design System Update v4.2\" from Marcus Williams <marcus.w@designhub.com>: read false → true; starred false → true; star type none → \"blue-star\"; labels: add label_9 \"Projects\".\n- \"Create a label called 'Conferences' under Work, and apply it to both Sophie Laurent's EuroDesign Summit email and the Figma Config 2026 email.\" → CREATE label \"Conferences\", nested under label_1 \"Work\", color background #c8e6c9, text #2e7d32. email 14 \"Bonjour! Conference Speaker Invitation\" from Sophie Laurent <sophie.l@eurodesign.fr>; email 46 \"Config 2026: Early bird tickets now available\" from Figma <newsletter@figma.com>: labels: add \"Conferences\" (the new label).\n- \"Disable the Promotions, Updates, and Forums category tabs, and change the inbox type to Important first.\" → setting inboxType (Settings > inbox tab): \"default\" → \"important_first\". setting categoriesEnabled promotions (Settings > inbox tab): true → false. setting categoriesEnabled updates (Settings > inbox tab): true → false. setting categoriesEnabled forums (Settings > inbox tab): true → false.\n- \"Edit the Morning Brew filter to also archive matching messages and mark them as read.\" → filter_2 (from=\"crew@morningbrew.com\"): action archive false → true; action markRead false → true.\n- \"Create a filter for emails with attachments larger than 5 MB that applies the Reference label and skips the inbox.\" → CREATE filter with criteria [hasAttachment=true, size=5, sizeUnit=\"MB\", sizeComparison=\"greater\"], actions [apply label label_19 \"Reference\", archive].\n- \"Archive all emails labeled Newsletters that are currently in the inbox.\" → email 72 \"HN Digest: Top stories this week\" from Hacker News <hn@ycombinator.com>; email 73 \"Trending: \\\"Building a real-time collaboration...\" from Dev.to <digest@dev.to>; email 75 \"Lobsters Weekly: Systems Programming\" from Lobsters <digest@lobste.rs>; email 77 \"Daily Brew: Fed signals rate cuts\" from Morning Brew <crew@morningbrew.com>; email 78 \"Big Tech hiring is back - what changed?\" from The Pragmatic Engineer <gergely@pragmaticengineer.com>; email 79 \"TLDR: GPT-5 benchmarks leaked\" from TLDR Newsletter <dan@tldrnewsletter.com>; email 80 \"AI and the future of search\" from Benedict Evans <newsletter@ben-evans.com>; email 81 \"The Great AI Unbundling\" from Stratechery <ben@stratechery.com>; email 112 \"Daily Digest: Top stories in Technology\" from Medium <noreply@medium.com>; email 118 \"Daily Brew: Tech IPOs heat up\" from Morning Brew <crew@morningbrew.com>: labels: remove INBOX \"Inbox\"; archived false → true.\n- \"Unsnooze Tom Bradley's mortgage pre-approval email and add the Action Required label to it.\" → email 83 \"Mortgage Pre-approval Documents\" from Tom Bradley <tom.bradley@realtyhome.com>: labels: add INBOX \"Inbox\", label_17 \"Action Required\"; snoozed true → false; snooze until \"2026-02-26T09:00:00Z\" → none.\n- \"Empty the trash, then report all the spam emails as not spam.\" → PERMANENTLY DELETE email 89 \"You have inherited $5,000,000\" from Unknown Sender <prince.of.lagos@hotmail.com>; email 90 \"Congratulations! You won $10,000!\" from Casino Online <winner@luckycasino.xxx>; email 91 \"AMAZING DEAL: iPhone for $1!!!\" from Flash Sale <deals@cheapelectronics.biz>; email 92 \"You won't believe what happened next\" from Newsletter Spam <updates@randomnews247.com>. email 93 \"Turn $100 into $100,000 with this coin!\" from Crypto Gains <invest@cryptomoon.xyz>; email 94 \"Lose 30 pounds in 30 days!\" from Weight Loss Miracle <health@dietpills4u.com>; email 95 \"Your email won the EU Lottery!\" from Lottery Winner <claims@eurolottery.scam>; email 96 \"Urgent: Verify your account now\" from Account Alert <security@bankofamerica-verify.com>; email 97 \"Claim your $500 Amazon Gift Card\" from Free Gift Cards <rewards@amazongiftcard.fake>: labels: add INBOX \"Inbox\"; in\
    \ spam true → false.\n- \"Update the Datadog alerts filter to also archive matching emails and forward them to priya.sharma@cloudnine.dev instead of nate.patel@devops.tools.\" → filter_10 (from=\"alerts@datadog.com\", hasWords=\"alert critical\"): action archive false → true; action forward \"nate.patel@devops.tools\" → \"priya.sharma@cloudnine.dev\".\n- \"Delete the Receipts label and add the Finance label to all emails that previously had Receipts applied.\" → DELETE label label_5 \"Receipts\". email 19 \"Shipping Update: Order #LP-2026-8834\" from Carlos Mendez <carlos.m@logisticspro.net>; email 67 \"Your package has been delivered\" from FedEx <tracking@fedex.com>; email 69 \"Your Google Play order receipt\" from Google <googleplay-noreply@google.com>; email 88 \"Your order has shipped: Mechanical Keyboard\" from Amazon <ship-confirm@amazon.com>: labels: add label_3 \"Finance\".\n- \"Archive all unread emails in the Social category.\" → email 31 \"Sarah Chen endorsed you for Cloud Architectur...\" from LinkedIn <notifications@linkedin.com>; email 33 \"[techcorp/api-gateway] PR #847 merged\" from GitHub <notifications@github.com>; email 37 \"[cloudnine/auth-service] Issue #312 assigned...\" from GitHub <notifications@github.com>; email 43 \"Dependabot: 3 security advisories\" from GitHub <notifications@github.com>: labels: remove INBOX \"Inbox\"; archived false → true.\n- \"Set up a filter for emails with 'invoice' or 'payment' in the subject that automatically applies the Invoices label and marks them as read.\" → CREATE filter with criteria [subject=\"invoice\", hasWords=\"payment\"], actions [apply label label_15 \"Invoices\", markRead].\n- \"Trash all promotional emails from Amazon, Nike, and REI.\" → email 44 \"Your recommendations: Tech deals of the week\" from Amazon <store-news@amazon.com>; email 52 \"Members Week: 25% off everything\" from Nike <promo@nike.com>; email 55 \"Garage Sale: Up to 50% off\" from REI <promotions@rei.com>: labels: remove INBOX \"Inbox\"; in trash false → true.\n- \"Change the star on the United Airlines deal email to a green star, move it from Promotions to Primary, and apply the Action Required label.\" → email 49 \"Flash Sale: SFO to Paris from $489\" from United Airlines <deals@united.com>: star type \"yellow-star\" → \"green-star\"; labels: add CATEGORY_PRIMARY \"Primary\", label_17 \"Action Required\"; remove CATEGORY_PROMOTIONS \"Promotions\"; category tab \"promotions\" → \"primary\".\n- \"Create a nested label 'Taxes' under Finance, then apply it to both of David Kim's finance-related emails — the tax season reminder and the year-end financial summary.\" → CREATE label \"Taxes\", nested under label_3 \"Finance\", color background #fff9c4, text #f57f17. email 28 \"Tax Season Reminder: Documents Needed\" from David Kim <david.kim@financeplus.com>; email 122 \"Year-End Financial Summary 2025\" from David Kim <david.kim@financeplus.com>: labels: add \"Taxes\" (the new label).\n- \"Switch to dark theme with compact density, disable both hover actions and dynamic email, and change the undo send delay to 20 seconds.\" → setting theme (Settings > general tab): \"default\" → \"dark\". setting density (Settings > general tab): \"default\" → \"compact\". setting dynamicEmail (Settings > general tab): true → false. setting hoverActions (Settings > general tab): true → false. setting undoSendDelay (Settings > general tab): 5 → 20.\n- \"Configure the multiple inbox: set section 1 to search 'is:important' with the name 'Priority', and section 2 to search 'label:Action Required' with the name 'Action Items'.\" → setting multipleInboxSections item 1 query (Settings > inbox tab): \"is:starred\" → \"is:important\". setting multipleInboxSections item 1 name (Settings > inbox tab): \"Starred\" → \"Priority\". setting multipleInboxSections item 2 query (Settings > inbox tab): \"is:snoozed\" → \"label:Action Required\". setting multipleInboxSections item 2 name (Settings > inbox tab): \"Snoozed\" → \"Action Items\".\n- \"Add the Clients label to David Kim's tax season reminder email.\" → email 28 \"Tax Season Reminder: Documents Needed\" from David Kim <david.kim@financeplus.com>: labels: add label_11 \"Clients\".\n- \"Delete the filter that handles GitHub notifications.\" → DELETE filter filter_1 (from=\"notifications@github.com\").\n- \"Turn off the Send and Archive feature.\" → setting sendAndArchive (Settings > general tab): true → false.\n- \"Disable the Forums category.\" → setting categoriesEnabled forums (Settings > inbox tab): true → false.\n- \"Archive the latest Morning Brew newsletter.\" → email 77 \"Daily Brew: Fed signals rate cuts\" from Morning Brew <crew@morningbrew.com>: labels: remove INBOX \"Inbox\"; archived false → true.\n- \"Add the Projects label to the office renovation email from Daniel Thompson.\" → email 17 \"Office Renovation Plans\" from Daniel Thompson <daniel.t@architectsllp.com>: labels: add label_9 \"Projects\".\n- \"Switch the inbox type to Important first.\" → setting inboxType (Settings > inbox tab): \"default\" → \"important_first\".\n- \"Empty the spam folder.\" → PERMANENTLY DELETE email 93 \"Turn $100 into $100,000 with this coin!\" from Crypto Gains <invest@cryptomoon.xyz>; email 94 \"Lose 30 pounds in 30 days!\" from Weight Loss Miracle <health@dietpills4u.com>; email 95 \"Your email won the EU Lottery!\" from Lottery Winner <claims@eurolottery.scam>; email 96 \"Urgent: Verify your account now\" from Account Alert <security@bankofamerica-verify.com>; email 97 \"Claim your $500 Amazon Gift Card\" from Free Gift Cards <rewards@amazongiftcard.fake>.\n- \"Move the archived sprint planning notes from Sarah Chen back to the inbox.\" → email 85 \"Meeting notes: Sprint planning\" from Sarah Chen <sarah.chen@techcorp.io>: labels: add INBOX \"Inbox\"; archived true → false.\n- \"Turn off the reply nudge suggestions.\" → setting nudges suggestEmailsToReply (Settings > general tab): true → false.\n- \"Set auto-advance to go to the previous (older) conversation.\" → setting autoAdvance (Settings > general tab): \"newer\" → \"older\".\n- \"Create a new label called 'Urgent' with a red background color.\" → CREATE label \"Urgent\", top level (no parent), color background #cc3333, text #fff.\n- \"Change button labels to show text instead of icons.\" → setting buttonLabels (Settings > general tab): \"icons\" → \"text\".\n- \"Move Emily Rodriguez's VC meetup email to the Social category.\" → email 30 \"VC Meetup Next Thursday\" from Emily Rodriguez <emily.r@startupventures.co>: labels: add CATEGORY_SOCIAL \"Social\"; remove CATEGORY_PRIMARY \"Primary\"; category tab \"primary\" → \"social\".\n- \"Snooze the CI/CD Pipeline Migration Plan email until tomorrow.\" → email 9 \"CI/CD Pipeline Migration Plan\" from Nate Patel <nate.patel@devops.tools>: labels: remove INBOX \"Inbox\"; snoozed false → true; snooze until none → \"2026-02-27T08:00:00.000Z\".\n- \"Remove the Action Required label from the contract review email by James O'Brien.\" → email 11 \"Contract Review: Vendor Agreement\" from James O'Brien <james.obrien@lawfirm.legal>: labels: remove label_17 \"Action Required\".\n- \"Set up a filter for emails from david.kim@financeplus.com that automatically applies the Finance label.\" → CREATE filter with criteria [from=\"david.kim@financeplus.com\"], actions [apply label label_3 \"Finance\"].\n- \"Block the sender of the '$5,000,000 inheritance' email in the trash.\" → BLOCK sender prince.of.lagos@hotmail.com (Settings > filters tab, blocked addresses).\n- \"Disable the Social category tab in the inbox.\" → setting categoriesEnabled social (Settings > inbox tab): true → false.\n- \"Rename the Reference label to Resources.\" → label_19 \"Reference\": name \"Reference\" → \"Resources\".\n"
