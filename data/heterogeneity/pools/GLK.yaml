  prompt_guidance: For milestones created before GitLab 13.6, the burndown chart has an additional Legacy/Fixed toggle. **Fixed** tracks full milestone history and stops counting removed issues after the due date passes. **Legacy** subtracts daily closures from daily openings and treats reopened issues as opened the day after they were last closed; changing the milestone start date changes the count of issues open on each day. Prefer Fixed for auditability; use Legacy only when reproducing historic behavior.
