  prompt_guidance: Start and due dates on an epic can be fixed or **Inherited**. When inherited, the start date auto-updates to the earliest start date across child epics and issue milestones, and the due date to the latest such date. These values recompute automatically as children change milestones, milestones shift dates, or issues are added/removed from the epic. Because inheritance is bottom-up, changing a leaf child epic's start date can cascade all the way to the top epic.
