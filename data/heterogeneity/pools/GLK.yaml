  prompt_guidance: Burndown and burnup charts only render on a milestone that has both a start date and a due date. Access them by opening the milestone from **Plan** > **Milestones**. Toggle between counting **Issues** and **Issue weight** above the chart—when using weight, ensure all issues have weights assigned or they'll be missing from the totals. Burndown shows remaining (total minus closed); burnup shows Total and Completed as separate lines so you can see scope changes (Total dropping when issues are removed) versus completion (Completed rising when issues close).
