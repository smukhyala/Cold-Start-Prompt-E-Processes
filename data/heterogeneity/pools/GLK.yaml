  prompt_guidance: 'When creating or editing labels in this GitLab instance, remember that scoped labels use double-colon syntax (`::`) in the title, for example `workflow::in-review`. An item cannot hold two scoped labels sharing the same key: assigning `priority::high` to an issue already carrying `priority::low` automatically removes the lower one. For nested scopes like `workflow::backend::review`, everything before the last `::` is the scope, so `workflow::backend::review` and `workflow::backend::development` are mutually exclusive, while `workflow::backend::review` and `workflow::frontend::review` can coexist. Filter by an entire scope with `<scope>::*` in the label search box. After assigning a scoped label, verify the mutual-exclusion behavior worked by checking that the previous key-matching label was removed from the sidebar.'
  prompt_sha256: 130828cd78f8daa84e212ae5a4c6bc56670ee29796e09650e9646e2c4cbcedf7
