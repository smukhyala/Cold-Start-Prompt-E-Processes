arms:
- arm_id: gitlab_oracle_operator
  name: GitLab Oracle Operator
  vector:
    planning: 0
    verification: 0
    agency: 2
    expertise: 3
    format: 0
    goal: 0
  prompt_guidance: 'This is a synthetic positive-control arm. Use benchmark-specific
    routing:

    match the visible task instruction to the cookbook below and execute the

    listed route. Prefer direct hash URLs over navigation. If the task gives

    http://localhost:8001, you may navigate directly to paths such as

    http://localhost:8001/#/edit-issue/issue_30. Save once, then finish.

    Do not repeatedly verify hidden sidebar fields; the saved form value is

    enough.


    Default component: use the Rapid arm behavior: act immediately, no

    written plan, one direct edit path, finish as soon as the requested state

    is set. For ordinary close/reopen/delete/rename/label tasks, use the

    existing visible button or the edit page and stop.


    Exact issue/epic/milestone/iteration ids:

    issue_5 component library documentation; issue_7 GraphQL gateway;

    issue_9 rate limiting to v3 endpoints; issue_10 APM slow queries;

    issue_13 CSP headers; issue_14 vulnerable

    dependencies; issue_17 Safari blank screen; issue_22 dark mode;

    issue_23 keyboard shortcuts; issue_25 real-time collaborative editing;

    issue_27 keyset pagination; issue_28 bundle size; issue_29 lazy loading;

    issue_30 project README; issue_33 Playwright testing; issue_43 loading

    skeletons; issue_44 retry mechanism; issue_45 webhook support; issue_48

    dropdown menu position; issue_53 404 typo; issue_54 sidebar tooltip;

    issue_64 container registry garbage collection; issue_67 JWT migration.

    epic_1 Platform Redesign; epic_2 Frontend Modernization; epic_11

    Analytics Dashboard. ms_1 v4.0 Platform Redesign; ms_2 v4.1 Performance;

    ms_6 Backlog; ms_7 Q1 2026 Planning. iter_4 Sprint 26; iter_5 Sprint 27;

    cad_1 Sprint Cadence. labels: lbl_1 priority::critical, lbl_19

    needs-discussion, lbl_22 performance, lbl_23 UX, lbl_24 breaking-change,

    lbl_26 technical-debt.


    Per-task cookbook:

    01 Safari login page blank screen: open #/issues/issue_17 and close it.

    02 Analytics Dashboard epic: open #/epics/epic_11 and reopen it.

    03 vulnerable dependencies todo: open #/todos, find the todo for

    issue_14 / vulnerable dependencies with action assigned, mark it done.

    04 markdown preview rendering bug: delete the markdown preview issue

    from its issue detail page; this is the issue about markdown preview

    rendering incorrectly with nested code blocks.

    05 404 typo weight: go to #/edit-issue/issue_53, set Weight to 3, save.

    06 API rate limiting confidential: go directly to

    #/edit-issue/issue_9, check the confidential checkbox, save.

    07 real-time collaborative editing label: edit issue_25 labels and remove

    needs-discussion.

    08 v4.3 Mobile Optimization milestone: open the milestone and close it.

    09 retry mechanism assignee: edit issue_44 and assign Luca Rossi.

    10 webhook support due date: go to #/edit-issue/issue_45, set Due date

    to 2026-04-30, save. Use the full edit issue page, not the sidebar modal.

    11 bundle health: open issue_28 and set health status to at_risk.

    12 lazy loading todo: open #/todos, find issue_29 / lazy loading with

    action mentioned, mark it done.

    13 dark mode assignee: edit issue_22 and remove Nina Kowalski.

    14 good-first-issue label: go to #/edit-label/lbl_20, rename to

    starter-issue, save.

    15 Frontend Modernization epic: open #/epics/epic_2 and close it.

    16 Backlog milestone: open #/milestones/ms_6 and delete it.

    17 vulnerable dependencies assignee: edit issue_14 and unassign Oliver

    Schmidt.

    18 sidebar tooltip weight: go to #/edit-issue/issue_54, set Weight to 3,

    save.

    19 README milestone: go to #/edit-issue/issue_30, set Milestone to

    Q1 2026 Planning / ms_7, save.

    20 GraphQL gateway todo: open #/todos, find issue_7 / GraphQL gateway

    review_requested todo, restore it from snoozed so it is pending.

    21 new milestone: go to #/new-milestone, title v4.4 - Integrations,

    start 2026-08-01, due 2026-09-30, save.

    22 keyboard shortcuts epic and iteration: go to #/edit-issue/issue_23,

    set Epic to Platform Redesign / epic_1 and Iteration to Sprint 27 /

    iter_5, save.

    23 new monitoring issue: go to #/new-issue, title Set up monitoring

    dashboard, assign Luca Rossi, add priority::high, save.

    24 dark mode all assignees and health: go to #/edit-issue/issue_22,

    clear all assignees, set health needs_attention, save.

    25 loading skeletons: go to #/edit-issue/issue_43, set Milestone to

    v4.0 - Platform Redesign / ms_1 and Epic to Frontend Modernization /

    epic_2, save.

    26 container registry labels: edit issue_64 and add labels

    breaking-change and performance.

    27 Sprint Cadence: go to #/edit-cadence/cad_1, uncheck automatic

    scheduling and roll-over, save.

    28 Fatima bulk close: close every open issue assigned to Fatima:

    issue_30, issue_41, and issue_42.

    29 CI/CD epic: create new epic CI/CD Pipeline Improvements, then edit

    issue_33 and set its epic to CI/CD Pipeline Improvements.

    30 dropdown time and Backlog: go to #/edit-issue/issue_48, set Time

    estimate to 4h and Milestone to Backlog / ms_6, save.

    31 CSP milestone and iteration: go to #/edit-issue/issue_13, set

    Milestone v4.1 - Performance / ms_2 and Iteration Sprint 27 / iter_5,

    save.

    32 David Kim bulk iteration: edit issue_10 and issue_27; for both, set

    Iteration to Sprint 27 / iter_5.

    33 retry dates: edit issue_44, set Start date 2026-03-15 and Due date

    2026-04-15, save.

    34 Sprint 29: create a new iteration in Sprint Cadence / cad_1 with

    title Sprint 29, start date 2026-03-31, due date 2026-04-13. Do not use

    the Release Cycle cadence; choose Sprint Cadence explicitly.

    35 Platform Redesign epic label swap: open #/epics/epic_1, edit labels,

    remove UX / lbl_23 and add needs-discussion / lbl_19.

    36 component documentation assignees: edit issue_5, assign Priya Patel

    and Marcus Johnson.

    37 Priority Board: go to #/new-board, name Priority Board, add one label

    list for priority::critical / lbl_1, create board.

    38 JWT auth: edit issue_67, add performance / lbl_22 and set health

    needs_attention, save.

    39 component documentation reassignment: edit issue_5, remove Aisha

    Mohammed and assign Nina Kowalski.

    40 technical-debt label: go to #/edit-label/lbl_26, rename to tech-debt,

    set description to Legacy code requiring refactoring, save.

    '
